name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            name: duster-macos-x86_64
            archive: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            name: duster-macos-arm64
            archive: tar
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: duster-linux-x86_64
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: duster-windows-x86_64
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.name }}.tar.gz duster

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/duster.exe" -DestinationPath "${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            duster-macos-x86_64/duster-macos-x86_64.tar.gz
            duster-macos-arm64/duster-macos-arm64.tar.gz
            duster-linux-x86_64/duster-linux-x86_64.tar.gz
            duster-windows-x86_64/duster-windows-x86_64.zip
